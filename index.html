<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Japanese - Complete Course</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #f8f5f0;
    color: #333;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: rgba(248, 245, 240, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 200;
  }

  .header-title {
    font-size: 1.2em;
    font-weight: 700;
    color: #e05a3a;
    cursor: pointer;
    transition: opacity 0.2s;
    text-decoration: none;
  }

  .header-title:hover { opacity: 0.7; }

  /* ===== MENU SCREEN ===== */
  #menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 80px 40px 40px;
  }

  #menu .menu-sub { font-size: 1.15em; color: #888; margin-bottom: 32px; }

  .section-heading {
    width: 100%;
    max-width: 900px;
    font-size: 1.1em;
    font-weight: 700;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 28px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #e8e4df;
  }

  .section-heading:first-of-type { margin-top: 0; }

  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    max-width: 900px;
    width: 100%;
  }

  .lesson-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .lesson-card:hover { border-color: #e05a3a; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
  .lesson-card .lnum { font-size: 0.85em; color: #e05a3a; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
  .lesson-card .lchars {
    font-size: 1.8em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    margin: 8px 0;
    color: #333;
    letter-spacing: 2px;
  }
  .lesson-card .ldesc { font-size: 0.95em; color: #888; }

  /* ===== SLIDES ===== */
  #slideshow { display: none; }

  .slide {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 66px 60px 80px;
    text-align: center;
    animation: fadeIn 0.35s ease;
    overflow-y: auto;
  }

  .slide.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 { font-size: 2.6em; color: #e05a3a; margin-bottom: 16px; }
  h2 { font-size: 2em; color: #e05a3a; margin-bottom: 14px; }
  h3 { font-size: 1.4em; color: #2d8cf0; margin-bottom: 10px; }
  p, li { font-size: 1.2em; line-height: 1.7; color: #444; }

  .subtitle { font-size: 1.3em; color: #999; margin-bottom: 24px; }

  /* Big character */
  .char-giant {
    font-size: 11em;
    line-height: 1;
    color: #333;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    margin: 6px 0;
  }

  .romaji { font-size: 2.4em; color: #e05a3a; font-weight: bold; margin-bottom: 6px; }
  .pronunciation { font-size: 1.15em; color: #777; margin-bottom: 16px; font-style: italic; }

  /* Stroke order */
  .stroke-order {
    background: #eef3f8;
    border-radius: 14px;
    padding: 18px 26px;
    margin: 12px 0;
    max-width: 680px;
  }

  .stroke-steps { display: flex; gap: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }

  .stroke-step { display: flex; flex-direction: column; align-items: center; gap: 5px; }

  .stroke-num {
    background: #e05a3a;
    color: #fff;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 0.85em;
  }

  .stroke-desc { font-size: 0.9em; color: #555; max-width: 130px; }

  /* Tip box */
  .tip {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 12px;
    padding: 14px 22px;
    margin: 12px 0;
    max-width: 640px;
    text-align: left;
  }

  .tip strong { color: #e89a0c; }

  /* Character row */
  .char-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }

  .char-box {
    background: #fff;
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    text-align: center;
    min-width: 80px;
  }

  .char-box .ch {
    font-size: 2.6em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
  }

  .char-box .label { font-size: 0.95em; color: #e05a3a; margin-top: 4px; font-weight: 600; }

  /* Word cards */
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    max-width: 860px;
    width: 100%;
    margin: 16px 0;
  }

  .word-card {
    background: #fff;
    border-radius: 14px;
    padding: 20px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s;
  }

  .word-card:hover { transform: translateY(-3px); border-color: #e05a3a; }

  .word-card .jp {
    font-size: 2.4em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
  }

  .word-card .rm { font-size: 1em; color: #e05a3a; margin: 4px 0; font-weight: 600; }
  .word-card .en { font-size: 0.95em; color: #888; }

  /* Quiz */
  .quiz-area { max-width: 680px; width: 100%; }
  .quiz-question { font-size: 1.25em; margin-bottom: 16px; color: #555; }

  .quiz-char {
    font-size: 6.5em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
    margin: 8px 0 18px;
  }

  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 460px;
    margin: 0 auto;
  }

  .quiz-btn {
    background: #fff;
    border: 2px solid #ddd;
    color: #333;
    padding: 14px;
    border-radius: 12px;
    font-size: 1.15em;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
  }

  .quiz-btn:hover { border-color: #e05a3a; background: #fff5f3; }
  .quiz-btn.correct { background: #e8f8f0; border-color: #27ae60; color: #27ae60; }
  .quiz-btn.wrong { background: #fdecea; border-color: #e74c3c; color: #e74c3c; }

  .quiz-feedback { margin-top: 16px; font-size: 1.2em; min-height: 36px; }

  /* Two column */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    align-items: center;
    max-width: 880px;
  }

  .col { text-align: center; }

  /* Score */
  .score-display { font-size: 3em; color: #27ae60; margin: 16px 0; font-weight: bold; }

  /* Navigation */
  .nav {
    position: fixed;
    bottom: 28px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    z-index: 100;
  }

  .nav-btn {
    background: #fff;
    border: 2px solid #e05a3a;
    color: #e05a3a;
    padding: 11px 26px;
    border-radius: 28px;
    font-size: 1.05em;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .nav-btn:hover { background: #e05a3a; color: #fff; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; background: #fff; color: #e05a3a; }

  .slide-counter { color: #aaa; font-size: 0.95em; min-width: 80px; text-align: center; }

  /* Progress */
  .progress {
    position: fixed;
    top: 52px; left: 0;
    height: 4px;
    background: linear-gradient(90deg, #e05a3a, #f0a030);
    transition: width 0.3s;
    z-index: 199;
    border-radius: 0 2px 2px 0;
  }

  /* 3 writing systems */
  .systems-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    max-width: 820px;
    margin: 18px 0;
  }

  .system-card {
    background: #fff;
    border-radius: 14px;
    padding: 22px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .system-card .example {
    font-size: 2.3em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
    margin: 8px 0;
  }

  .system-card .name { color: #e05a3a; font-size: 1.15em; font-weight: bold; }
  .system-card .desc { color: #888; font-size: 0.9em; margin-top: 6px; }

  /* Responsive */
  /* ===== GENKI LESSON STYLES ===== */
  .lesson-card.genki { border-left: 4px solid #2d8cf0; }
  .lesson-card.genki:hover { border-color: #2d8cf0; }
  .lesson-card.genki .lnum { color: #2d8cf0; }

  .grammar-pattern {
    font-size: 2.2em;
    font-weight: 700;
    color: #333;
    margin: 18px 0;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  }

  .gp-particle { color: #e05a3a; font-weight: 800; }
  .gp-copula { color: #2d8cf0; font-weight: 800; }

  .grammar-breakdown {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 16px 0;
  }

  .breakdown-item {
    background: #fff;
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    text-align: center;
    min-width: 100px;
  }

  .breakdown-item .part { font-size: 1.5em; font-weight: 700; color: #333; }
  .breakdown-item .role { font-size: 0.85em; color: #888; margin-top: 4px; }

  .example-sentence {
    background: #f0f6ff;
    border-radius: 12px;
    padding: 16px 24px;
    margin: 8px 0;
    max-width: 640px;
    text-align: left;
  }

  .example-sentence .jp-line {
    font-size: 1.4em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
    margin-bottom: 4px;
  }

  .example-sentence .en-line { font-size: 1em; color: #666; }

  .dialogue-container {
    max-width: 560px;
    width: 100%;
    margin: 16px auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dialogue-line { display: flex; flex-direction: column; }
  .dialogue-line.right { align-items: flex-end; }
  .dialogue-line.left { align-items: flex-start; }

  .speaker-name {
    font-size: 0.8em;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
    padding: 0 14px;
  }

  .dialogue-bubble {
    background: #fff;
    border-radius: 18px;
    padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    max-width: 85%;
    text-align: left;
  }

  .dialogue-line.right .dialogue-bubble { background: #e8f4ff; }

  .dialogue-bubble .jp-text {
    font-size: 1.2em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
  }

  .dialogue-bubble .en-text { font-size: 0.9em; color: #888; margin-top: 4px; }

  .word-card .context { font-size: 0.8em; color: #aaa; margin-top: 4px; font-style: italic; }

  .phrase-detail {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 12px 0;
  }

  .phrase-jp {
    font-size: 3em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
  }

  .phrase-rm { font-size: 1.3em; color: #2d8cf0; font-weight: 600; }
  .phrase-en { font-size: 1.1em; color: #666; }
  .phrase-context { font-size: 0.95em; color: #999; font-style: italic; margin-top: 4px; }
  .phrase-casual { font-size: 1em; color: #888; margin-top: 8px; }
  .phrase-casual span { color: #e05a3a; font-weight: 600; }

  /* Quiz text question (non-character) */
  .quiz-text {
    font-size: 1.6em;
    font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    color: #333;
    margin: 8px 0 18px;
  }

  @media (max-width: 768px) {
    #menu { padding: 70px 20px 30px; }
    .slide { padding: 60px 24px 20px; }
    .two-col { grid-template-columns: 1fr; gap: 16px; }
    .char-giant { font-size: 7em; }
    .systems-grid { grid-template-columns: 1fr; }
    h1 { font-size: 2em; }
    h2 { font-size: 1.6em; }
    .word-grid { grid-template-columns: repeat(2, 1fr); }
    .grammar-pattern { font-size: 1.6em; }
    .phrase-jp { font-size: 2.2em; }
    .dialogue-bubble { max-width: 95%; }
    .grammar-breakdown { gap: 8px; }
    .breakdown-item { min-width: 80px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<header class="header">
  <span class="header-title" onclick="goToMenu()">Learn Japanese</span>
</header>
<div class="progress" id="progress"></div>

<!-- ===== MENU ===== -->
<div id="menu">
  <p class="menu-sub">Complete course for beginners</p>
  <div id="lessonGrid"></div>
</div>

<!-- ===== SLIDESHOW ===== -->
<div id="slideshow">
  <div id="slidesContainer"></div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">&larr; Back</button>
    <span class="slide-counter" id="counter"></span>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Next &rarr;</button>
  </div>
</div>

<script>
// ============================================================
//  LESSON DATA
// ============================================================
const LESSONS = [
  // ── Hiragana 1: Vowels + K ──
  {
    title: "Hiragana 1",
    subtitle: "Vowels & K-row",
    rows: [
      {
        name: "The 5 Vowels",
        intro: "Every Japanese sound is built on these 5 vowels. Master these first!",
        pattern: "Japanese vowels sound like Spanish or Italian, NOT English!<br><b>a</b> = \"ah\" &nbsp; <b>i</b> = \"ee\" &nbsp; <b>u</b> = \"oo\" &nbsp; <b>e</b> = \"eh\" &nbsp; <b>o</b> = \"oh\"",
        chars: [
          { ch:'\u3042', rm:'a', pron:'Say "ah" \u2014 like opening your mouth at the doctor', strokes:['Horizontal line, left to right','Vertical line going down-left','Loop \u2014 curve right, down, and around'], tip:'\u3042 looks a bit like the letter "a" tilted sideways!' },
          { ch:'\u3044', rm:'i', pron:'Say "ee" \u2014 like "eat" or "feet"', strokes:['Left stroke \u2014 short curve down','Right stroke \u2014 longer curve down'], tip:'\u3044 looks like two people standing side by side!' },
          { ch:'\u3046', rm:'u', pron:'Say "oo" \u2014 like "food" but with relaxed lips', strokes:['Short dash on top','Curved body \u2014 down and around'], tip:'\u3046 looks like a face with an open mouth saying "oo"!' },
          { ch:'\u3048', rm:'e', pron:'Say "eh" \u2014 like "red" or "bed"', strokes:['Short horizontal line on top','Main body \u2014 down, right, loop left'], tip:'In Japanese, "e" says "eh", NOT "ee". That\'s what \u3044 is for!' },
          { ch:'\u304a', rm:'o', pron:'Say "oh" \u2014 like "go" or "so"', strokes:['Horizontal line, left to right','Vertical line with curve at bottom','Small stroke on the right side'], tip:'\u304a looks like \u3042 but with a small extra stroke. Don\'t mix them up!' }
        ],
        words: [
          { jp:'\u3042\u3044', rm:'a-i', en:'love', icon:'\u2764\uFE0F' },
          { jp:'\u3044\u3048', rm:'i-e', en:'house', icon:'\u{1F3E0}' },
          { jp:'\u3046\u3048', rm:'u-e', en:'above / up', icon:'\u2B06\uFE0F' },
          { jp:'\u3042\u304a\u3044', rm:'a-o-i', en:'blue / green', icon:'\u{1F535}' },
          { jp:'\u3042\u3046', rm:'a-u', en:'to meet', icon:'\u{1F91D}' },
          { jp:'\u3044\u3046', rm:'i-u', en:'to say', icon:'\u{1F4AC}' }
        ]
      },
      {
        name: "K-row",
        intro: "Add \"K\" in front of each vowel to get the K-row!",
        pattern: "<b>a \u2192 ka</b>, <b>i \u2192 ki</b>, <b>u \u2192 ku</b>, <b>e \u2192 ke</b>, <b>o \u2192 ko</b><br>Every row in hiragana follows this same vowel order: a, i, u, e, o.",
        chars: [
          { ch:'\u304b', rm:'ka', pron:'Say "kah" \u2014 like "car" without the r', strokes:['Horizontal line, left to right','Vertical line curving left at bottom','Short diagonal on the right'], tip:'\u304b looks like a person cutting \u2014 "ka" as in "cut"!' },
          { ch:'\u304d', rm:'ki', pron:'Say "kee" \u2014 like "key"', strokes:['Top horizontal line','Second horizontal line','Vertical line through both','Small curved tail'], tip:'\u304d sounds like "key" \u2014 imagine a key shape!' },
          { ch:'\u304f', rm:'ku', pron:'Say "koo" \u2014 like "cool" without the l', strokes:['One stroke! Angle down-left, then down-right. Like a < sign.'], tip:'Easiest one! \u304f is just one stroke \u2014 looks like a "less than" sign: <' },
          { ch:'\u3051', rm:'ke', pron:'Say "keh" \u2014 like "Ken" without the n', strokes:['Vertical line on the left','Horizontal line with curve going down','Long line on the right'], tip:'\u3051 has 3 parts standing together!' },
          { ch:'\u3053', rm:'ko', pron:'Say "koh" \u2014 like "coat" without the t', strokes:['Top horizontal line','Bottom line with slight curve'], tip:'\u3053 looks like two mouths stacked \u2014 saying "ko-ko" (cluck cluck)!' }
        ],
        words: [
          { jp:'\u304b\u304a', rm:'ka-o', en:'face', icon:'\u{1F642}' },
          { jp:'\u304d', rm:'ki', en:'tree', icon:'\u{1F333}' },
          { jp:'\u3053\u3044', rm:'ko-i', en:'carp (fish)', icon:'\u{1F41F}' },
          { jp:'\u3044\u3051', rm:'i-ke', en:'pond', icon:'\u{1F4A7}' },
          { jp:'\u3053\u3048', rm:'ko-e', en:'voice', icon:'\u{1F5E3}\uFE0F' },
          { jp:'\u304b\u304d', rm:'ka-ki', en:'persimmon', icon:'\u{1F351}' }
        ]
      }
    ]
  },

  // ── Hiragana 2: S-row + T-row ──
  {
    title: "Hiragana 2",
    subtitle: "S-row & T-row",
    rows: [
      {
        name: "S-row",
        intro: "Add \"S\" to each vowel \u2014 but watch out for one special sound!",
        pattern: "<b>sa, shi, su, se, so</b><br>\u26a0\ufe0f \"si\" becomes <b>\"shi\"</b> in Japanese. This is the first irregular sound!",
        chars: [
          { ch:'\u3055', rm:'sa', pron:'Say "sah" \u2014 like "sun" with "ah"', strokes:['Horizontal line, left to right','Vertical line crossing it','Curved stroke at bottom-right'], tip:'\u3055 looks like a person sitting on a chair \u2014 "sa"-t down!' },
          { ch:'\u3057', rm:'shi', pron:'Say "shee" \u2014 like "she"', strokes:['One smooth curve from bottom-left sweeping up to the right'], tip:'\u3057 is one beautiful curve \u2014 like a fishing hook! And it\'s "shi" not "si".' },
          { ch:'\u3059', rm:'su', pron:'Say "soo" \u2014 like "soon"', strokes:['Horizontal line on top','Vertical going down, looping around'], tip:'\u3059 has a loop at the bottom \u2014 like a lasso!' },
          { ch:'\u305b', rm:'se', pron:'Say "seh" \u2014 like "set" without the t', strokes:['Vertical line on the left','Horizontal line across','Curved line on the right going down'], tip:'\u305b looks like a hand reaching out to "se"-ize something!' },
          { ch:'\u305d', rm:'so', pron:'Say "soh" \u2014 like "so" in English', strokes:['Starting top-left, curve right','Then zigzag down to the bottom'], tip:'\u305d looks like a zigzag \u2014 like sewing ("so" in Japanese means "to sew")!' }
        ],
        words: [
          { jp:'\u3055\u3051', rm:'sa-ke', en:'salmon / rice wine', icon:'\u{1F376}' },
          { jp:'\u3059\u3057', rm:'su-shi', en:'sushi', icon:'\u{1F363}' },
          { jp:'\u3057\u304a', rm:'shi-o', en:'salt', icon:'\u{1F9C2}' },
          { jp:'\u3042\u3055', rm:'a-sa', en:'morning', icon:'\u{1F305}' },
          { jp:'\u3059\u304d', rm:'su-ki', en:'like (favorite)', icon:'\u{1F496}' },
          { jp:'\u305d\u3053', rm:'so-ko', en:'there', icon:'\u{1F449}' }
        ]
      },
      {
        name: "T-row",
        intro: "The T-row has THREE special sounds. Pay attention!",

// ============================================================
//  BUILD MENU
// ============================================================
function buildMenu() {
  const container = document.getElementById('lessonGrid');
  const categories = [
    { label: 'Basic Hiragana', range: [0, 5] },
    { label: 'Dakuten & Handakuten', range: [5, 7] },
    { label: 'Combinations', range: [7, 8] },
    { label: 'Numbers & Counting', range: [8, 9] },
    { label: 'Japanese Basics (Genki 1)', range: [9, 10] }
  ];

  categories.forEach(cat => {
    const heading = document.createElement('h2');
    heading.className = 'section-heading';
    heading.textContent = cat.label;
    container.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'lesson-grid';
    container.appendChild(grid);

    for (let i = cat.range[0]; i < cat.range[1]; i++) {
      const lesson = LESSONS[i];
      const isGenki = lesson.type === 'genki';
      let preview = '';
      if (isGenki) {
        // For Genki lessons, show first row name as preview
        preview = lesson.rows[0].name;
      } else {
        const chars = lesson.rows.flatMap(r => r.chars.map(c => c.ch));
        preview = chars.slice(0, 3).join(' ') + (chars.length > 3 ? ' ...' : '');
      }
      const card = document.createElement('div');
      card.className = 'lesson-card' + (isGenki ? ' genki' : '');
      card.innerHTML = `
        <div class="lnum">${lesson.title}</div>
        <div class="lchars">${preview}</div>
        <div class="ldesc">${lesson.subtitle}</div>
      `;
      card.onclick = () => startLesson(i);
      grid.appendChild(card);
    }
  });
}

// ============================================================
//  BUILD SLIDES FOR A LESSON
// ============================================================
let allSlides = [];
let currentSlide = 0;
let quizData = [];
let quizIndex = 0;
let quizScore = 0;
let quizStarted = false;
let currentLesson = -1;

function startLesson(lessonIdx) {
  currentLesson = lessonIdx;
  const lesson = LESSONS[lessonIdx];
  const container = document.getElementById('slidesContainer');
  container.innerHTML = '';
  allSlides = [];
  quizStarted = false;

  if (lesson.type === 'genki') {
    buildGenkiSlides(lesson);
  } else {
    buildHiraganaSlides(lesson);
  }

  // Show slideshow
  document.getElementById('menu').style.display = 'none';
  document.getElementById('slideshow').style.display = 'block';
  document.body.style.overflow = 'hidden';
  currentSlide = 0;
  showSlide(0);
}

function buildHiraganaSlides(lesson) {
  // Slide 1: Title
  addSlide(`
    <h1>${lesson.title}</h1>
    <p class="subtitle">${lesson.subtitle}</p>
    <p style="color:#aaa; margin-top:30px;">Use arrow keys or buttons to navigate</p>
  `);

  // For each row
  lesson.rows.forEach((row, ri) => {
    // Row overview
    const charBoxes = row.chars.map(c => `
      <div class="char-box"><div class="ch">${c.ch}</div><div class="label">${c.rm}</div></div>
    `).join('');

    addSlide(`
      <h2>${row.name}</h2>
      <p style="margin-bottom:10px;">${row.intro}</p>
      <div class="char-row">${charBoxes}</div>
      <div class="tip"><strong>Pattern:</strong> ${row.pattern}</div>
    `);

    // Individual character slides
    row.chars.forEach(c => {
      const strokeSteps = c.strokes.map((s, si) => `
        <div class="stroke-step">
          <div class="stroke-num">${si + 1}</div>
          <div class="stroke-desc">${s}</div>
        </div>
      `).join('');

      addSlide(`
        <div class="two-col">
          <div class="col">
            <div class="char-giant">${c.ch}</div>
            <div class="romaji">${c.rm}</div>
            <div class="pronunciation">${c.pron}</div>
          </div>
          <div class="col">
            <div class="stroke-order">
              <h3>Stroke Order (${c.strokes.length} stroke${c.strokes.length > 1 ? 's' : ''})</h3>
              <div class="stroke-steps">${strokeSteps}</div>
            </div>
            <div class="tip" style="margin-top:14px;">
              <strong>Memory tip:</strong> ${c.tip}
            </div>
          </div>
        </div>
      `);
    });

    // Practice words
    const wordCards = row.words.map(w => `
      <div class="word-card">
        ${w.icon ? '<div style="font-size:2em; margin-bottom:4px;">' + w.icon + '</div>' : ''}
        <div class="jp">${w.jp}</div>
        <div class="rm">${w.rm}</div>
        <div class="en">${w.en}</div>
      </div>
    `).join('');

    addSlide(`
      <h2>Practice Words: ${row.name}</h2>
      <p style="margin-bottom:14px;">Try reading these! You know all the characters.</p>
      <div class="word-grid">${wordCards}</div>
    `);
  });

  // Quiz slide
  quizData = lesson.rows.flatMap(r => r.chars.map(c => ({ ch: c.ch, ans: c.rm })));
  addSlide(`
    <h2>Final Quiz: All Characters</h2>
    <div class="quiz-area">
      <div class="quiz-question" id="qq-question">What sound does this character make?</div>
      <div class="quiz-char" id="qq-char"></div>
      <div class="quiz-options" id="qq-options"></div>
      <div class="quiz-feedback" id="qq-feedback"></div>
      <p style="color:#aaa; margin-top:14px; font-size:0.9em;" id="qq-progress"></p>
    </div>
  `, true);

  // Score slide
  const allCharBoxes = lesson.rows.flatMap(r => r.chars).map(c => `
    <div class="char-box"><div class="ch">${c.ch}</div><div class="label">${c.rm}</div></div>
  `).join('');

  addSlide(`
    <h2>Your Score</h2>
    <div class="score-display" id="final-score">-</div>
    <p id="score-message" style="font-size:1.25em; margin-bottom:24px; color:#555;"></p>
    <h3 style="margin-bottom:12px;">Characters you learned:</h3>
    <div class="char-row">${allCharBoxes}</div>
    <p style="color:#aaa; margin-top:28px;">Practice writing each one 10 times!</p>
  `);
}

function buildGenkiSlides(lesson) {
  // Title slide
  addSlide(`
    <h1>${lesson.title}</h1>
    <p class="subtitle">${lesson.subtitle}</p>
    <p style="color:#aaa; margin-top:30px;">Use arrow keys or buttons to navigate</p>
  `);

  // Build slides for each row based on content type
  lesson.rows.forEach(row => {
    if (row.phrases) {
      // Phrase overview slide
      const phraseCards = row.phrases.map(p => `
        <div class="word-card">
          ${p.icon ? '<div style="font-size:2em; margin-bottom:4px;">' + p.icon + '</div>' : ''}
          <div class="jp" style="font-size:1.6em;">${p.jp}</div>
          <div class="rm" style="color:#2d8cf0;">${p.rm}</div>
          <div class="en">${p.en}</div>
          ${p.context ? '<div class="context">' + p.context + '</div>' : ''}
        </div>
      `).join('');

      addSlide(`
        <h2>${row.name}</h2>
        <div class="word-grid">${phraseCards}</div>
      `);

      // Individual phrase detail slides
      row.phrases.forEach(p => {
        addSlide(`
          <div class="phrase-detail">
            ${p.icon ? '<div style="font-size:3.5em; margin-bottom:8px;">' + p.icon + '</div>' : ''}
            <div class="phrase-jp">${p.jp}</div>
            <div class="phrase-rm">${p.rm}</div>
            <div class="phrase-en">${p.en}</div>
            <div class="phrase-context">${p.context || ''}</div>
            ${p.casual ? '<div class="phrase-casual">Casual: <span>' + p.casual + '</span></div>' : ''}
          </div>
        `);
      });
    }

    if (row.grammar) {
      row.grammar.forEach(g => {
        // Grammar pattern slide
        const breakdownHtml = g.breakdown.map(b => `
          <div class="breakdown-item">
            <div class="part">${b.part}</div>
            <div class="role">${b.role}</div>
          </div>
        `).join('');

        const examplesHtml = g.examples.map(ex => `
          <div class="example-sentence">
            <div class="jp-line">${ex.jp}</div>
            <div class="en-line">${ex.en}</div>
          </div>
        `).join('');

        addSlide(`
          <h2>${row.name}</h2>
          <div class="grammar-pattern">${g.pattern}</div>
          <p style="font-size:1.2em; color:#666; margin-bottom:16px;">${g.meaning}</p>
          <div class="grammar-breakdown">${breakdownHtml}</div>
        `);

        // Examples slide
        addSlide(`
          <h2>Examples: ${g.meaning}</h2>
          ${examplesHtml}
        `);
      });
    }

    if (row.vocab) {
      const vocabCards = row.vocab.map(v => `
        <div class="word-card">
          ${v.icon ? '<div style="font-size:2em; margin-bottom:4px;">' + v.icon + '</div>' : ''}
          <div class="jp">${v.jp}</div>
          <div class="rm" style="color:#2d8cf0;">${v.rm}</div>
          <div class="en">${v.en}</div>
        </div>
      `).join('');

      addSlide(`
        <h2>${row.name}</h2>
        <div class="word-grid">${vocabCards}</div>
      `);
    }

    if (row.dialogue) {
      const lines = row.dialogue.map((d, i) => {
        const side = i % 2 === 0 ? 'left' : 'right';
        return `
          <div class="dialogue-line ${side}">
            <div class="speaker-name">${d.speaker}</div>
            <div class="dialogue-bubble">
              <div class="jp-text">${d.jp}</div>
              <div class="en-text">${d.en}</div>
            </div>
          </div>
        `;
      }).join('');

      addSlide(`
        <h2>${row.name}</h2>
        <div class="dialogue-container">${lines}</div>
      `);
    }
  });

  // Genki quiz slide
  if (lesson.quiz) {
    genkiQuizData = lesson.quiz.items.map(item => ({
      question: item.q,
      answer: item.a,
      options: [...item.options]
    }));
    quizData = genkiQuizData;

    addSlide(`
      <h2>Quiz Time!</h2>
      <div class="quiz-area">
        <div class="quiz-question" id="qq-question"></div>
        <div class="quiz-text" id="qq-char"></div>
        <div class="quiz-options" id="qq-options"></div>
        <div class="quiz-feedback" id="qq-feedback"></div>
        <p style="color:#aaa; margin-top:14px; font-size:0.9em;" id="qq-progress"></p>
      </div>
    `, true, 'genki');

    // Score slide
    addSlide(`
      <h2>Your Score</h2>
      <div class="score-display" id="final-score">-</div>
      <p id="score-message" style="font-size:1.25em; margin-bottom:24px; color:#555;"></p>
      <p style="color:#aaa; margin-top:28px;">Great work! Review any items you missed.</p>
    `);
  }
}

let genkiQuizData = [];

function addSlide(html, isQuiz, quizType) {
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = html;
  div.dataset.isQuiz = isQuiz ? 'true' : 'false';
  div.dataset.quizType = quizType || 'hiragana';
  document.getElementById('slidesContainer').appendChild(div);
  allSlides.push(div);
}

function showSlide(n) {
  if (allSlides[currentSlide]) allSlides[currentSlide].classList.remove('active');
  currentSlide = n;
  allSlides[currentSlide].classList.add('active');
  document.getElementById('counter').textContent = (currentSlide + 1) + ' / ' + allSlides.length;
  document.getElementById('progress').style.width = ((currentSlide + 1) / allSlides.length * 100) + '%';
  document.getElementById('prevBtn').disabled = currentSlide === 0;
  document.getElementById('nextBtn').disabled = currentSlide === allSlides.length - 1;

  // Start quiz if needed
  if (allSlides[currentSlide].dataset.isQuiz === 'true' && !quizStarted) {
    quizStarted = true;
    quizIndex = 0;
    quizScore = 0;
    const qType = allSlides[currentSlide].dataset.quizType;
    if (qType === 'genki') {
      shuffleArray(genkiQuizData);
      quizData = genkiQuizData;
      showGenkiQuizQuestion();
    } else {
      shuffleArray(quizData);
      showQuizQuestion();
    }
  }

  // Show score on last slide
  if (currentSlide === allSlides.length - 1) {
    showFinalScore();
  }
}

function changeSlide(dir) {
  const next = currentSlide + dir;
  if (next >= 0 && next < allSlides.length) showSlide(next);
}

function goToMenu() {
  document.getElementById('slideshow').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('progress').style.width = '0%';
  document.body.style.overflow = '';
  quizStarted = false;
}

// ============================================================
//  QUIZ ENGINE
// ============================================================
function showQuizQuestion() {
  if (quizIndex >= quizData.length) {
    document.getElementById('qq-char').textContent = '';
    document.getElementById('qq-question').textContent = 'Quiz complete!';
    document.getElementById('qq-options').innerHTML = '';
    document.getElementById('qq-feedback').textContent = 'You got ' + quizScore + ' / ' + quizData.length + ' correct!';
    document.getElementById('qq-feedback').style.color = '#27ae60';
    document.getElementById('qq-progress').textContent = 'Go to the next slide to see your results!';
    return;
  }

  const q = quizData[quizIndex];
  document.getElementById('qq-char').textContent = q.ch;
  document.getElementById('qq-feedback').textContent = '';
  document.getElementById('qq-progress').textContent = 'Question ' + (quizIndex + 1) + ' of ' + quizData.length;

  // Build options: correct + 3 wrong
  const allOptions = quizData.map(x => x.ans);
  let wrong = allOptions.filter(x => x !== q.ans);
  shuffleArray(wrong);
  const choices = [q.ans, wrong[0], wrong[1], wrong[2]].filter(Boolean);
  shuffleArray(choices);

  const container = document.getElementById('qq-options');
  container.innerHTML = '';
  choices.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt, q.ans);
    container.appendChild(btn);
  });
}

function checkAnswer(btn, selected, correct) {
  const btns = document.querySelectorAll('#qq-options .quiz-btn');
  btns.forEach(b => b.onclick = null);

  if (selected === correct) {
    btn.classList.add('correct');
    document.getElementById('qq-feedback').textContent = 'Correct!';
    document.getElementById('qq-feedback').style.color = '#27ae60';
    quizScore++;
  } else {
    btn.classList.add('wrong');
    btns.forEach(b => { if (b.textContent === correct) b.classList.add('correct'); });
    document.getElementById('qq-feedback').textContent = 'The answer is: ' + correct;
    document.getElementById('qq-feedback').style.color = '#e74c3c';
  }
  quizIndex++;
  setTimeout(showQuizQuestion, 1100);
}

function showFinalScore() {
  const el = document.getElementById('final-score');
  if (!el) return;
  el.textContent = quizScore + ' / ' + quizData.length;
  const pct = quizScore / quizData.length;
  let msg = '';
  if (pct === 1) msg = 'Perfect! You are amazing!';
  else if (pct >= 0.8) msg = 'Great job! Just a little more practice!';
  else if (pct >= 0.6) msg = 'Good start! Review the ones you missed.';
  else msg = 'Keep practicing! Try going through the slides again.';
  const msgEl = document.getElementById('score-message');
  if (msgEl) msgEl.textContent = msg;
}

// ============================================================
//  GENKI QUIZ ENGINE
// ============================================================
function showGenkiQuizQuestion() {
  if (quizIndex >= genkiQuizData.length) {
    document.getElementById('qq-char').textContent = '';
    document.getElementById('qq-question').textContent = 'Quiz complete!';
    document.getElementById('qq-options').innerHTML = '';
    document.getElementById('qq-feedback').textContent = 'You got ' + quizScore + ' / ' + genkiQuizData.length + ' correct!';
    document.getElementById('qq-feedback').style.color = '#27ae60';
    document.getElementById('qq-progress').textContent = 'Go to the next slide to see your results!';
    return;
  }

  const q = genkiQuizData[quizIndex];
  document.getElementById('qq-question').textContent = q.question;
  document.getElementById('qq-char').textContent = '';
  document.getElementById('qq-feedback').textContent = '';
  document.getElementById('qq-progress').textContent = 'Question ' + (quizIndex + 1) + ' of ' + genkiQuizData.length;

  const choices = [...q.options];
  shuffleArray(choices);

  const container = document.getElementById('qq-options');
  container.innerHTML = '';
  choices.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-btn';
    btn.textContent = opt;
    btn.style.fontSize = '1em';
    btn.onclick = () => checkGenkiAnswer(btn, opt, q.answer);
    container.appendChild(btn);
  });
}

function checkGenkiAnswer(btn, selected, correct) {
  const btns = document.querySelectorAll('#qq-options .quiz-btn');
  btns.forEach(b => b.onclick = null);

  if (selected === correct) {
    btn.classList.add('correct');
    document.getElementById('qq-feedback').textContent = 'Correct!';
    document.getElementById('qq-feedback').style.color = '#27ae60';
    quizScore++;
  } else {
    btn.classList.add('wrong');
    btns.forEach(b => { if (b.textContent === correct) b.classList.add('correct'); });
    document.getElementById('qq-feedback').textContent = 'The answer is: ' + correct;
    document.getElementById('qq-feedback').style.color = '#e74c3c';
  }
  quizIndex++;
  setTimeout(showGenkiQuizQuestion, 1100);
}

// ============================================================
//  UTILITIES
// ============================================================
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

document.addEventListener('keydown', (e) => {
  if (document.getElementById('slideshow').style.display === 'none') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); changeSlide(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); changeSlide(-1); }
  if (e.key === 'Escape') goToMenu();
});

// Init
buildMenu();
</script>
